name: Update works

on:
  workflow_dispatch:

jobs:
  update-works:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: |
          yarn install
      - run: |
          yarn update-works
      - uses: peter-evans/create-pull-request@v5
        with:
          title: Update works
          commit-message: Update works
          branch: update-works
          add-paths: src/data/works.tsv
